<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1e88e5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="css/style.css">
    <title>AMC Trasferte</title>
</head>
<body>

<header class="app-header">
    <h1>AMC Trasferte</h1>
    <span class="status-pill" id="connection-status" aria-live="polite">●</span>
</header>

<main class="container">

    <section class="card" id="form-section">
        <h2>Nuova trasferta</h2>
        <form id="trip-form" autocomplete="off">

            <div class="field">
                <label for="date">Data</label>
                <input type="date" id="date" name="date" required>
            </div>

            <div class="field autocomplete">
                <label for="departure">Partenza</label>
                <input type="text" id="departure" name="departure"
                       placeholder="es. Caprino Bergamasco"
                       autocomplete="off" inputmode="search" required>
                <ul class="suggestions" id="departure-suggestions" role="listbox"></ul>
            </div>

            <div class="field autocomplete">
                <label for="arrival">Arrivo</label>
                <input type="text" id="arrival" name="arrival"
                       placeholder="es. Via Roma 12, Milano"
                       autocomplete="off" inputmode="search" required>
                <ul class="suggestions" id="arrival-suggestions" role="listbox"></ul>
            </div>

            <div class="field">
                <label for="notes">Note (opzionale)</label>
                <textarea id="notes" name="notes" rows="2"
                          placeholder="Cliente, cantiere, motivo..."></textarea>
            </div>

            <button type="submit" class="btn-primary" id="submit-btn">
                Invia trasferta
            </button>

            <div id="form-feedback" class="feedback" aria-live="polite"></div>
        </form>
    </section>

    <section class="card" id="history-section">
        <h2>
            Ultime trasferte
            <button type="button" class="btn-link" id="toggle-history" aria-expanded="true">
                <span aria-hidden="true">▾</span>
            </button>
        </h2>
        <ul class="trip-list" id="trip-list" aria-live="polite">
            <li class="empty">Nessuna trasferta inviata da questo dispositivo.</li>
        </ul>
    </section>

</main>

<footer class="app-footer">
    <small>PWA AMC Trasferte · <span id="app-version">v1.0</span></small>
</footer>

<script src="config.js"></script>
<script src="js/storage.js"></script>
<script src="js/here.js"></script>
<script src="js/odoo.js"></script>
<script src="js/queue.js"></script>
<script src="js/app.js"></script>
</body>
</html>
